<!-- ===== Modal Ενσωμάτωσης σε Μάθημα MkDocs ===== -->
<div x-show="showEmbed" x-cloak class="fixed inset-0 z-50 bg-slate-900/60 grid place-items-center p-4" @keydown.escape.window="showEmbed=false">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto" @click.outside="showEmbed=false">
    <h2 class="text-lg font-bold text-slate-900">🧩 Ενσωμάτωση σε Μάθημα MkDocs</h2>
    <p class="text-sm text-slate-500 mt-1" x-text="embedActivity ? embedActivity.title : ''"></p>

    <label class="block text-xs font-semibold text-slate-600 mt-4 mb-1">Έτοιμος κώδικας iframe (ύψος: <span x-text="embedHeight"></span>px)</label>
    <input type="range" min="300" max="1200" step="50" x-model.number="embedHeight" @change="loadEmbedCode()" class="w-full accent-cyan-600">
    <textarea readonly rows="4" x-ref="embedCodeBox" class="w-full mt-1 rounded-lg border-slate-300 border px-3 py-2 text-xs font-mono bg-slate-50" x-text="embedCode"></textarea>
    <button @click="copyText(embedCode, 'Ο κώδικας iframe αντιγράφηκε!')" class="mt-2 px-3 py-1.5 text-xs rounded-lg bg-slate-900 text-white font-semibold hover:bg-slate-700">📋 Αντιγραφή Κώδικα</button>

    <div class="mt-5 pt-4 border-t border-slate-200">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Ή ενσωμάτωσέ την απευθείας σε υπάρχον μάθημα με 1 κλικ:</label>
      <select x-model="embedLesson" class="w-full text-sm rounded-lg border-slate-300 border px-3 py-2 bg-white">
        <option value="">— Επίλεξε μάθημα (.md) —</option>
        <template x-for="g in lessonGroups" :key="g.slug">
          <optgroup :label="g.label">
            <template x-for="l in g.lessons" :key="l.path">
              <option :value="l.path" x-text="l.label"></option>
            </template>
          </optgroup>
        </template>
      </select>
      <p class="text-xs text-slate-400 mt-1">Η άσκηση προστίθεται στο τέλος της σελίδας με αυτόματο αντίγραφο ασφαλείας (.bak) και άμεσο rebuild του /docs/.</p>
      <div class="flex gap-2 justify-end mt-3">
        <button @click="showEmbed=false" class="px-4 py-2 text-sm rounded-lg bg-slate-100 hover:bg-slate-200">Κλείσιμο</button>
        <button @click="doEmbed()" :disabled="!embedLesson || busy" class="px-4 py-2 text-sm rounded-lg bg-cyan-600 text-white font-semibold hover:bg-cyan-500 disabled:opacity-50">🧩 Ενσωμάτωση τώρα</button>
      </div>
      <p x-show="embedDone" x-cloak class="mt-2 text-sm text-emerald-700">✅ Ενσωματώθηκε! <a :href="embedDoneUrl" target="_blank" class="underline font-semibold">Άνοιγμα μαθήματος →</a></p>
    </div>
  </div>
</div>
