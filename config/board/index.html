<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ψηφιακός Πίνακας Τάξης — Ψηφιακή Πύλη</title>
<meta name="description" content="Ψηφιακός πίνακας τάξης: σχεδίαση, σχήματα, βέλη, κείμενο, σβήστρα και εξαγωγή PNG. Αυτόματη αποθήκευση στον browser.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0; --ink:#0f172a;
    --muted:#64748b; --accent:#1d4ed8; --accent-soft:#dbeafe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:"DejaVu Sans","Liberation Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  header{
    display:flex;align-items:center;gap:.75rem;padding:.45rem .9rem;
    background:linear-gradient(90deg,#1e3a8a,#1d4ed8 55%,#0369a1);color:#fff;flex:none;
  }
  header .logo{font-size:1.35rem}
  header h1{font-size:1rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  header .sub{font-size:.72rem;color:#bfdbfe;display:none}
  @media(min-width:900px){header .sub{display:inline}}
  header .spacer{flex:1}
  #saveState{font-size:.72rem;color:#bbf7d0;white-space:nowrap}
  header a.back{
    color:#fff;text-decoration:none;font-size:.75rem;font-weight:600;
    padding:.3rem .7rem;border-radius:.5rem;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);white-space:nowrap;
  }
  header a.back:hover{background:rgba(255,255,255,.25)}
  #toolbar{
    flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;
    padding:.4rem .6rem;background:var(--panel);border-bottom:1px solid var(--line);
    box-shadow:0 1px 3px rgba(15,23,42,.06);z-index:5;
  }
  .tbtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:52px;padding:.3rem .35rem;border:1px solid transparent;border-radius:.55rem;
    background:transparent;cursor:pointer;color:var(--ink);font:inherit;
  }
  .tbtn .ic{font-size:1.15rem;line-height:1.15}
  .tbtn .lb{font-size:.6rem;color:var(--muted);line-height:1}
  .tbtn:hover{background:#f1f5f9}
  .tbtn.active{background:var(--accent-soft);border-color:#93c5fd}
  .tbtn.active .lb{color:var(--accent);font-weight:700}
  .tbtn.warn:hover{background:#fee2e2}
  .sep{width:1px;align-self:stretch;margin:.15rem .25rem;background:var(--line)}
  .group{display:flex;align-items:center;gap:.35rem;padding:0 .15rem}
  .group label{font-size:.62rem;color:var(--muted);font-weight:700}
  #swatches{display:flex;gap:.25rem;align-items:center}
  .swatch{
    width:22px;height:22px;border-radius:50%;border:2px solid #fff;cursor:pointer;
    box-shadow:0 0 0 1px var(--line);padding:0;
  }
  .swatch.active{box-shadow:0 0 0 2px var(--accent);transform:scale(1.12)}
  input[type=color]{
    width:26px;height:26px;border:1px solid var(--line);border-radius:.4rem;
    background:#fff;padding:1px;cursor:pointer;
  }
  input[type=range]{width:90px;accent-color:var(--accent)}
  select{
    font:inherit;font-size:.75rem;padding:.25rem .3rem;border:1px solid var(--line);
    border-radius:.45rem;background:#fff;color:var(--ink);cursor:pointer;
  }
  #sizeVal{font-size:.68rem;color:var(--muted);min-width:2.4em;text-align:right}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  #board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
  #textInput{
    position:absolute;display:none;z-index:10;min-width:140px;max-width:60vw;
    border:2px dashed var(--accent);border-radius:.35rem;background:rgba(255,255,255,.92);
    padding:.25rem .4rem;outline:none;font-family:inherit;resize:both;overflow:auto;
    -webkit-user-select:text;user-select:text;
  }
  #hint{
    position:absolute;left:50%;bottom:.7rem;transform:translateX(-50%);
    font-size:.7rem;color:var(--muted);background:rgba(241,245,249,.9);
    border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem;
    pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;
  }
  @media(max-width:760px){
    .tbtn{min-width:44px}.tbtn .lb{display:none}
    input[type=range]{width:64px}#hint{display:none}
  }
</style>
</head>
<body>

<header>
  <span class="logo">🖍️</span>
  <h1>Ψηφιακός Πίνακας Τάξης</h1>
  <span class="sub">Σχεδίασε ελεύθερα — αποθηκεύεται αυτόματα στον browser σου</span>
  <span class="spacer"></span>
  <span id="saveState">✓ Αποθηκεύτηκε</span>
  <a class="back" href="/" title="Επιστροφή στην Ψηφιακή Πύλη">🏫 Πύλη</a>
</header>

<div id="toolbar">
  <button class="tbtn active" data-tool="pen"    title="Μολύβι — ελεύθερη σχεδίαση (M)"><span class="ic">✏️</span><span class="lb">Μολύβι</span></button>
  <button class="tbtn" data-tool="line"   title="Ευθεία γραμμή (G)"><span class="ic">📏</span><span class="lb">Γραμμή</span></button>
  <button class="tbtn" data-tool="arrow"  title="Βέλος (B)"><span class="ic">↗️</span><span class="lb">Βέλος</span></button>
  <button class="tbtn" data-tool="rect"   title="Ορθογώνιο (O)"><span class="ic">▭</span><span class="lb">Ορθογώνιο</span></button>
  <button class="tbtn" data-tool="ellipse" title="Έλλειψη / Κύκλος (K)"><span class="ic">◯</span><span class="lb">Έλλειψη</span></button>
  <button class="tbtn" data-tool="text"   title="Κείμενο — κάνε κλικ στον πίνακα (T)"><span class="ic">🔤</span><span class="lb">Κείμενο</span></button>
  <button class="tbtn" data-tool="eraser" title="Σβήστρα — σβήνει ολόκληρα αντικείμενα (Σ)"><span class="ic">🧽</span><span class="lb">Σβήστρα</span></button>

  <span class="sep"></span>

  <div class="group" id="swatches" title="Χρώμα σχεδίασης">
    <button class="swatch active" data-color="#1e293b" style="background:#1e293b" title="Μαύρο"></button>
    <button class="swatch" data-color="#dc2626" style="background:#dc2626" title="Κόκκινο"></button>
    <button class="swatch" data-color="#1d4ed8" style="background:#1d4ed8" title="Μπλε"></button>
    <button class="swatch" data-color="#059669" style="background:#059669" title="Πράσινο"></button>
    <button class="swatch" data-color="#d97706" style="background:#d97706" title="Πορτοκαλί"></button>
    <button class="swatch" data-color="#7c3aed" style="background:#7c3aed" title="Μωβ"></button>
    <input type="color" id="customColor" value="#1e293b" title="Άλλο χρώμα…">
  </div>

  <span class="sep"></span>

  <div class="group" title="Πάχος γραμμής">
    <label for="size">Πάχος</label>
    <input type="range" id="size" min="1" max="24" value="4">
    <span id="sizeVal">4 px</span>
  </div>

  <div class="group" id="fillGroup" title="Γέμισμα σχήματος">
    <label for="fill">Γέμισμα</label>
    <select id="fill">
      <option value="none">Χωρίς</option>
      <option value="solid">Πλήρες</option>
      <option value="soft">Απαλό</option>
    </select>
  </div>

  <span class="sep"></span>

  <button class="tbtn" id="undoBtn" title="Αναίρεση (Ctrl+Z)"><span class="ic">↩️</span><span class="lb">Αναίρεση</span></button>
  <button class="tbtn" id="redoBtn" title="Επανάληψη (Ctrl+Y)"><span class="ic">↪️</span><span class="lb">Επανάληψη</span></button>
  <button class="tbtn warn" id="clearBtn" title="Καθαρισμός όλου του πίνακα"><span class="ic">🗑️</span><span class="lb">Καθαρισμός</span></button>

  <span class="sep"></span>

  <button class="tbtn" id="pngBtn" title="Εξαγωγή ως εικόνα PNG"><span class="ic">🖼️</span><span class="lb">PNG</span></button>
  <button class="tbtn" id="fsBtn" title="Πλήρης οθόνη"><span class="ic">⛶</span><span class="lb">Οθόνη</span></button>
</div>

<div id="stage">
  <canvas id="board"></canvas>
  <textarea id="textInput" rows="2" placeholder="Γράψε κείμενο… (Enter για καταχώρηση, Shift+Enter για νέα γραμμή)"></textarea>
  <div id="hint">💡 Ctrl+Z: αναίρεση · Ctrl+Y: επανάληψη · Τα σχέδια αποθηκεύονται αυτόματα σε αυτόν τον υπολογιστή</div>
</div>



<script>
"use strict";
/* =========================================================================
   Ψηφιακός Πίνακας Τάξης — 100% client-side (0 MB RAM στον server).
   Τα αντικείμενα αποθηκεύονται ως JSON στο localStorage και επανασχεδιάζονται
   σε κάθε αλλαγή. Υποστηρίζει ποντίκι, αφή και πένα (Pointer Events).
   ========================================================================= */
const LS_KEY = "school-board-v1";
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const textInput = document.getElementById("textInput");
const saveState = document.getElementById("saveState");

let shapes = [];          // {tool,color,size,fill,points|a,b,text,fontSize}
let undoStack = [], redoStack = [];
let tool = "pen", color = "#1e293b", size = 4, fillMode = "none";
let drawing = null;       // προσωρινό αντικείμενο κατά το drag
let erasing = false;
let dpr = Math.max(1, window.devicePixelRatio || 1);
let saveTimer = null;

/* ---------------- Αποθήκευση / ανάκτηση ---------------- */
function snapshot(){ undoStack.push(JSON.stringify(shapes)); if (undoStack.length > 60) undoStack.shift(); redoStack = []; }
function scheduleSave(){
  saveState.textContent = "… Αποθήκευση";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({shapes, color, size, fillMode}));
      const t = new Date();
      saveState.textContent = "✓ Αποθηκεύτηκε " + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
    } catch(e){ saveState.textContent = "⚠️ Αδυναμία αποθήκευσης"; }
  }, 400);
}
function loadSaved(){
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d && Array.isArray(d.shapes)) {
      shapes = d.shapes;
      if (d.color) setColor(d.color);
      if (d.size) { size = d.size; sizeInput.value = size; sizeVal.textContent = size + " px"; }
      if (d.fillMode) { fillMode = d.fillMode; fillSel.value = fillMode; }
    }
  } catch(e){ /* κατεστραμμένα δεδομένα → άδειος πίνακας */ }
}

/* ---------------- Σχεδίαση ---------------- */
function resizeCanvas(){
  dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = stage.getBoundingClientRect();
  canvas.width  = Math.round(r.width  * dpr);
  canvas.height = Math.round(r.height * dpr);
  redraw();
}
function drawShape(c, s){
  c.strokeStyle = s.color; c.fillStyle = s.color;
  c.lineWidth = s.size; c.lineCap = "round"; c.lineJoin = "round";
  switch (s.tool) {
    case "pen": {
      if (s.points.length < 2) { c.beginPath(); c.arc(s.points[0].x, s.points[0].y, s.size/2, 0, 7); c.fill(); break; }
      c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y);
      c.stroke(); break;
    }
    case "line": c.beginPath(); c.moveTo(s.a.x, s.a.y); c.lineTo(s.b.x, s.b.y); c.stroke(); break;
    case "arrow": {
      const ang = Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x);
      const head = Math.max(10, s.size * 3.2);
      c.beginPath(); c.moveTo(s.a.x, s.a.y); c.lineTo(s.b.x, s.b.y); c.stroke();
      c.beginPath(); c.moveTo(s.b.x, s.b.y);
      c.lineTo(s.b.x - head*Math.cos(ang - .45), s.b.y - head*Math.sin(ang - .45));
      c.lineTo(s.b.x - head*Math.cos(ang + .45), s.b.y - head*Math.sin(ang + .45));
      c.closePath(); c.fill(); break;
    }
    case "rect": case "ellipse": {
      const x = Math.min(s.a.x, s.b.x), y = Math.min(s.a.y, s.b.y);
      const w = Math.abs(s.b.x - s.a.x), h = Math.abs(s.b.y - s.a.y);
      c.beginPath();
      if (s.tool === "rect") c.rect(x, y, w, h);
      else c.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI*2);
      if (s.fill === "solid") { c.fill(); }
      else if (s.fill === "soft") { c.save(); c.globalAlpha = .18; c.fill(); c.restore(); }
      c.stroke(); break;
    }
    case "text": {
      c.font = "600 " + s.fontSize + "px 'DejaVu Sans','Liberation Sans',sans-serif";
      c.textBaseline = "top";
      s.text.split("\n").forEach((ln, i) => c.fillText(ln, s.a.x, s.a.y + i * s.fontSize * 1.25));
      break;
    }
  }
}
function redraw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  for (const s of shapes) drawShape(ctx, s);
  if (drawing) drawShape(ctx, drawing);
}



/* ---------------- Γεωμετρία σβήστρας ---------------- */
function distToSeg(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx+dy*dy;
  let t = L2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function shapeHit(s, p, r){
  const tol = r + s.size/2;
  switch (s.tool) {
    case "pen":
      for (let i = 1; i < s.points.length; i++)
        if (distToSeg(p, s.points[i-1], s.points[i]) <= tol) return true;
      return s.points.length === 1 && Math.hypot(p.x-s.points[0].x, p.y-s.points[0].y) <= tol;
    case "line": case "arrow": return distToSeg(p, s.a, s.b) <= tol;
    case "rect": case "ellipse": {
      const x = Math.min(s.a.x,s.b.x)-tol, y = Math.min(s.a.y,s.b.y)-tol;
      const w = Math.abs(s.b.x-s.a.x)+2*tol, h = Math.abs(s.b.y-s.a.y)+2*tol;
      return p.x >= x && p.x <= x+w && p.y >= y && p.y <= y+h;
    }
    case "text": {
      const lines = s.text.split("\n");
      const w = Math.max(...lines.map(l => l.length)) * s.fontSize * .62;
      const h = lines.length * s.fontSize * 1.25;
      return p.x >= s.a.x-tol && p.x <= s.a.x+w+tol && p.y >= s.a.y-tol && p.y <= s.a.y+h+tol;
    }
  }
  return false;
}
function eraseAt(p){
  const before = shapes.length;
  shapes = shapes.filter(s => !shapeHit(s, p, Math.max(8, size*2)));
  if (shapes.length !== before) { redraw(); scheduleSave(); }
}

/* ---------------- Pointer events (ποντίκι / αφή / πένα) ---------------- */
function pos(ev){
  const r = canvas.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top};
}
canvas.addEventListener("pointerdown", ev => {
  if (ev.button !== 0 && ev.pointerType === "mouse") return;
  commitText();
  const p = pos(ev);
  canvas.setPointerCapture(ev.pointerId);
  if (tool === "text") { openTextInput(p); return; }
  snapshot();
  if (tool === "eraser") { erasing = true; eraseAt(p); return; }
  if (tool === "pen") drawing = {tool, color, size, points:[p]};
  else drawing = {tool, color, size, fill: fillMode, a:p, b:p};
  redraw();
});
canvas.addEventListener("pointermove", ev => {
  const p = pos(ev);
  if (erasing) { eraseAt(p); return; }
  if (!drawing) return;
  if (drawing.tool === "pen") {
    const last = drawing.points[drawing.points.length-1];
    if (Math.hypot(p.x-last.x, p.y-last.y) > 1.2) drawing.points.push(p);
  } else drawing.b = p;
  redraw();
});
function endStroke(){
  if (erasing) { erasing = false; return; }
  if (!drawing) return;
  const tiny = drawing.tool !== "pen" &&
    Math.hypot(drawing.b.x-drawing.a.x, drawing.b.y-drawing.a.y) < 3;
  if (!tiny) shapes.push(drawing);
  else undoStack.pop();
  drawing = null; redraw(); scheduleSave();
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

/* ---------------- Κείμενο ---------------- */
let textPos = null;
function openTextInput(p){
  textPos = p;
  const fs = Math.max(16, size * 5);
  textInput.style.display = "block";
  textInput.style.left = Math.min(p.x, stage.clientWidth - 160) + "px";
  textInput.style.top  = Math.min(p.y, stage.clientHeight - 70) + "px";
  textInput.style.color = color;
  textInput.style.fontSize = fs + "px";
  textInput.value = "";
  setTimeout(() => textInput.focus(), 0);
}
function commitText(){
  if (textInput.style.display !== "block") return;
  const txt = textInput.value.replace(/\s+$/,"");
  textInput.style.display = "none";
  if (txt && textPos) {
    snapshot();
    shapes.push({tool:"text", color, size, a:textPos, text:txt, fontSize:Math.max(16, size*5)});
    redraw(); scheduleSave();
  }
  textPos = null;
}
textInput.addEventListener("keydown", ev => {
  ev.stopPropagation();
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); commitText(); }
  if (ev.key === "Escape") { textInput.value = ""; commitText(); }
});
textInput.addEventListener("blur", commitText);


/* ---------------- Εργαλεία / ρυθμίσεις ---------------- */
const toolBtns = [...document.querySelectorAll(".tbtn[data-tool]")];
function setTool(t){
  tool = t;
  toolBtns.forEach(b => b.classList.toggle("active", b.dataset.tool === t));
  canvas.style.cursor = t === "eraser" ? "cell" : t === "text" ? "text" : "crosshair";
  document.getElementById("fillGroup").style.display =
    (t === "rect" || t === "ellipse") ? "flex" : "none";
}
toolBtns.forEach(b => b.addEventListener("click", () => { commitText(); setTool(b.dataset.tool); }));

const swatches = [...document.querySelectorAll(".swatch")];
const customColor = document.getElementById("customColor");
function setColor(c){
  color = c; customColor.value = c;
  swatches.forEach(s => s.classList.toggle("active", s.dataset.color === c));
}
swatches.forEach(s => s.addEventListener("click", () => setColor(s.dataset.color)));
customColor.addEventListener("input", () => setColor(customColor.value));

const sizeInput = document.getElementById("size"), sizeVal = document.getElementById("sizeVal");
sizeInput.addEventListener("input", () => { size = +sizeInput.value; sizeVal.textContent = size + " px"; scheduleSave(); });
const fillSel = document.getElementById("fill");
fillSel.addEventListener("change", () => { fillMode = fillSel.value; scheduleSave(); });

document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);
function undo(){
  commitText();
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(shapes));
  shapes = JSON.parse(undoStack.pop());
  redraw(); scheduleSave();
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(shapes));
  shapes = JSON.parse(redoStack.pop());
  redraw(); scheduleSave();
}
document.getElementById("clearBtn").addEventListener("click", () => {
  if (!shapes.length) return;
  if (confirm("Να σβηστούν ΟΛΑ τα σχέδια από τον πίνακα;\n(Μπορείς να αναιρέσεις με Ctrl+Z)")) {
    snapshot(); shapes = []; redraw(); scheduleSave();
  }
});

/* ---------------- Εξαγωγή PNG ---------------- */
document.getElementById("pngBtn").addEventListener("click", () => {
  commitText();
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height;
  const c = out.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, out.width/dpr, out.height/dpr);
  for (const s of shapes) drawShape(c, s);
  const a = document.createElement("a");
  const d = new Date();
  a.download = "pinakas-taksis-" + d.toISOString().slice(0,10) + ".png";
  a.href = out.toDataURL("image/png");
  a.click();
});

/* ---------------- Πλήρης οθόνη ---------------- */
document.getElementById("fsBtn").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

/* ---------------- Συντομεύσεις πληκτρολογίου ---------------- */
window.addEventListener("keydown", ev => {
  if (ev.target === textInput) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === "y") { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const map = {m:"pen", g:"line", b:"arrow", o:"rect", k:"ellipse", t:"text", "σ":"eraser", s:"eraser"};
  if (map[k]) setTool(map[k]);
});

/* ---------------- Εκκίνηση ---------------- */
window.addEventListener("resize", resizeCanvas);
new ResizeObserver(resizeCanvas).observe(stage);
loadSaved();
setTool("pen");
resizeCanvas();
scheduleSave();
</script>
