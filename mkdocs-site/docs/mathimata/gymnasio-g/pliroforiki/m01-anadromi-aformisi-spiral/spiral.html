<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Το Σπιράλ της Αναδρομής</title>
<style>
  :root { --ink:#1a237e; --accent:#d81b60; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, 'Segoe UI', sans-serif; margin: 0; background:#f5f7ff; color:var(--ink); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 1.1rem; margin: 4px 0 8px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; font-size:.85rem; }
  button { border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:6px;
           padding:6px 14px; font-size:.85rem; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  label { display:flex; align-items:center; gap:6px; }
  canvas { background:#fff; border:1px solid #c5cae9; border-radius:8px; width:100%; height:auto; display:block; }
  .status { font-size:.85rem; margin-top:8px; min-height:2.4em; padding:6px 10px; border-radius:6px; background:#e8eaf6; }
  .status.err { background:#ffebee; color:#b71c1c; font-weight:600; }
  .status.ok { background:#e8f5e9; color:#1b5e20; font-weight:600; }
  .calls { font-family: monospace; font-size:.75rem; color:#5c6bc0; margin-top:6px; max-height:5.5em; overflow-y:auto;
           background:#fff; border:1px dashed #c5cae9; border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌀 Σχεδίασε_Σπιράλ(μήκος) — αναδρομή βήμα-βήμα</h1>
  <div class="controls">
    <button id="start" class="primary">▶ Ξεκίνα spiral(10)</button>
    <button id="step">⏭ Ένα βήμα</button>
    <button id="reset">↻ Επαναφορά</button>
    <label><input type="checkbox" id="stopcond"> Συνθήκη διακοπής (μήκος &lt; 360)</label>
    <label>Ταχύτητα <input type="range" id="speed" min="1" max="10" value="6"></label>
  </div>
  <canvas id="cv" width="880" height="420"></canvas>
  <div class="status" id="status">Πάτησε «Ξεκίνα» — αρχικά ΧΩΡΙΣ συνθήκη διακοπής. Τι θα συμβεί;</div>
  <div class="calls" id="calls"></div>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var statusEl = document.getElementById('status'), callsEl = document.getElementById('calls');
  var startBtn = document.getElementById('start'), stepBtn = document.getElementById('step');
  var resetBtn = document.getElementById('reset'), stopChk = document.getElementById('stopcond');
  var speedInp = document.getElementById('speed');
  var st = null, timer = null;

  function reset() {
    clearTimeout(timer); timer = null;
    st = { x: cv.width/2, y: cv.height/2, heading: 0, len: 10, depth: 0, done: false };
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#3f51b5'; ctx.lineCap = 'round';
    callsEl.textContent = '';
    statusEl.className = 'status';
    statusEl.textContent = 'Πάτησε «Ξεκίνα» — αρχικά ΧΩΡΙΣ συνθήκη διακοπής. Τι θα συμβεί;';
    startBtn.disabled = false; stepBtn.disabled = false;
  }

  function oneStep() {
    if (!st || st.done) return;
    st.depth++;
    var rad = st.heading * Math.PI / 180;
    var nx = st.x + st.len * Math.cos(rad), ny = st.y + st.len * Math.sin(rad);
    ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(nx, ny); ctx.stroke();
    st.x = nx; st.y = ny; st.heading += 90;
    var line = document.createElement('div');
    line.textContent = 'spiral(' + st.len + ') → σχεδιάζω πλευρά ' + st.len + ', καλώ spiral(' + (st.len + 5) + ')';
    callsEl.appendChild(line); callsEl.scrollTop = callsEl.scrollHeight;
    st.len += 5;
    // Έλεγχος: με συνθήκη διακοπής σταματά στο όριο της «σκηνής» (360)
    if (stopChk.checked && st.len >= 360) {
      st.done = true;
      statusEl.className = 'status ok';
      statusEl.textContent = '✅ Σταμάτησε! Το μήκος έφτασε τα 360 βήματα — η συνθήκη διακοπής δούλεψε (' + st.depth + ' κλήσεις).';
      startBtn.disabled = true; stepBtn.disabled = true;
      return;
    }
    // Χωρίς συνθήκη: προσομοιώνουμε το «κρασάρισμα» όταν βγει εκτός σκηνής
    if (!stopChk.checked && (st.x < -50 || st.x > cv.width + 50 || st.y < -50 || st.y > cv.height + 50)) {
      st.done = true;
      statusEl.className = 'status err';
      statusEl.textContent = '💥 Βγήκε εκτός σκηνής και ΔΕΝ σταματά! Χωρίς βήμα διακοπής παραβιάζεται η περατότητα. ' +
        'Τσέκαρε τη «Συνθήκη διακοπής» και ξαναδοκίμασε.';
      startBtn.disabled = true; stepBtn.disabled = true;
      return;
    }
    if (st.depth > 500) { // δικλείδα ασφαλείας προσομοίωσης
      st.done = true;
      statusEl.className = 'status err';
      statusEl.textContent = '💥 Stack overflow! Η αναδρομή δεν τελειώνει ποτέ χωρίς βήμα διακοπής.';
    }
  }

  function loop() {
    oneStep();
    if (st && !st.done) timer = setTimeout(loop, 550 - speedInp.value * 50);
  }

  startBtn.addEventListener('click', function () {
    if (!st || st.done) reset();
    startBtn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = stopChk.checked
      ? '🌀 Εκτελείται WITH συνθήκη διακοπής… παρακολούθησε τις κλήσεις!'
      : '🌀 Εκτελείται ΧΩΡΙΣ συνθήκη διακοπής… για πόσο θα αντέξει;';
    loop();
  });
  stepBtn.addEventListener('click', function () { clearTimeout(timer); oneStep(); });
  resetBtn.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
